version: 2
updates:
  # Main Worker (dmarcheck) npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # One PR per week for routine bumps; majors and security fixes stay separate.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # MTA-STS Worker npm dependencies
  - package-ecosystem: "npm"
    directory: "/mta-sts-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used in .github/workflows — keeps SHA-pinned actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      # CodeQL init and analyze must share a version or the Analyze job fails.
      codeql:
        patterns: ["github/codeql-action*"]
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
