name: PR provenance

# Server-side enforcement of routine-gate Condition 1: "only these issue authors
# can ever reach auto-merge" (scripts/routine-gate/config.ts).
#
# WHY THIS EXISTS. External contributors cannot merge here — they have no write
# access. The reachable attack is indirect: a malicious GitHub *issue* that an
# autonomous routine picks up, implements, and self-merges. The attacker never
# needs write access, only for an agent to act on their text.
#
# That chain was previously blocked only client-side — the author-trust gate in
# cc-routine/implement-from-issue §1, and scripts/routine-gate/. Both live in
# agent instructions; a routine that does not load the skill bypasses them. The
# CODEOWNERS review gate was meant to be the server-side backstop but is inert
# (`require_code_owner_review: true` is a no-op at `required_approving_review_count: 0`).
#
# WHY NOT JUST RUN gate.ts. Its contract is "may this auto-merge" (exit 0) vs
# "escalate" (exit 2), which is a routine decision, not a merge-safety verdict.
# It also fails a PR for missing `Closes #n`, >250 lines, >8 files, touching a
# risk path, scope drift — and `if (!pr.ciAllGreen)`, which is circular for a
# check that is itself part of CI. Making it required would block nearly every
# real PR. This workflow enforces Condition 1 ONLY; every other condition stays
# a routine-side auto-merge decision.
#
# Ordinary work is unaffected: a PR that links no issue, or links an issue from
# an allowlisted author, passes. Agent autonomy is preserved — this is a status
# check, not a human approval.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out allowlist source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify linked issues come from trusted authors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail

          # Single source of truth: parse the allowlist out of the routine-gate
          # config rather than duplicating it here. Fail closed if it cannot be
          # read — an unparseable allowlist must not silently allow everything.
          # Names are read off the single line declaring each key, not with a
          # bracket-bounded regex: a GitHub App login such as "andonos[bot]"
          # contains a literal "]" and a /\[([^\]]*)\]/ match truncates inside it.
          READ_LIST='
            const fs = require("fs");
            const key = process.argv[1];
            const src = fs.readFileSync("scripts/routine-gate/config.ts", "utf8");
            const line = src.split("\n").find((l) => l.includes(key + ":"));
            if (!line) { console.log(""); process.exit(0); }
            const names = [...line.matchAll(/"([^"]+)"/g)].map((x) => x[1].toLowerCase());
            console.log(names.join(" "));
          '

          ALLOW=$(node -e "$READ_LIST" allowlistAuthors)
          if [ -z "$ALLOW" ]; then
            echo "::error::could not read a non-empty allowlistAuthors from scripts/routine-gate/config.ts — failing closed."
            exit 1
          fi
          echo "Trusted issue authors: $ALLOW"

          # Second tier: authors trusted only for issues a human has labelled
          # spec-approved. The operating agent self-specs its own issues, so its
          # issue text alone is not a vetted spec; the label is, because applying
          # a label needs write access to the repo. May be absent or empty, which
          # simply means no second tier.
          ALLOW_LABELLED=$(node -e "$READ_LIST" allowlistAuthorsWithApproval)
          echo "Trusted with spec-approved label: ${ALLOW_LABELLED:-(none)}"

          # Collect every issue this PR claims to close, mirroring the strips in
          # closesIssueRefs() (scripts/routine-gate/gate-core.ts): fenced code,
          # inline code spans, HTML comments, and blockquote lines are removed
          # first. Over-collecting is NOT safer here — a PR that merely quotes
          # or triages an untrusted issue number in an example block would fail
          # and become unmergeable, which is the same deadlock as a required
          # context that never reports. The PR body is written by our own agent,
          # not the attacker, so stripping cannot be used to smuggle anything in:
          # a hidden ref simply means no ref, and routine-gate already fails
          # closed on zero refs before auto-merge.
          REFS=$(PR_BODY="${PR_BODY:-}" node -e '
            const body = process.env.PR_BODY || "";
            const cleaned = body
              .replace(/```[\s\S]*?```/g, " ")
              .replace(/`[^`\n]+`/g, " ")
              .replace(/<!--[\s\S]*?-->/g, " ")
              .replace(/<!--[^\n]*/g, " ")
              .split("\n")
              .filter((l) => !/^\s*>/.test(l))
              .join("\n");
            const refs = new Set();
            for (const m of cleaned.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)) {
              refs.add(Number(m[1]));
            }
            console.log([...refs].sort((a, b) => a - b).join("\n"));
          ')

          if [ -z "$REFS" ]; then
            echo "PR links no issue — nothing to verify. Passing."
            exit 0
          fi

          # Plain string comparison, not grep: a login containing brackets is a
          # grep bracket expression and would never match itself.
          in_list() {
            local needle="$1"; shift
            local item
            for item in $*; do
              [ "$item" = "$needle" ] && return 0
            done
            return 1
          }

          FAILED=0
          for N in $REFS; do
            AUTHOR=$(gh api "repos/$REPO/issues/$N" --jq '.user.login' 2>/dev/null || echo "")
            if [ -z "$AUTHOR" ]; then
              echo "::error::Linked issue #$N could not be read — failing closed."
              FAILED=1
              continue
            fi
            LOWER=$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')
            if in_list "$LOWER" "$ALLOW"; then
              echo "Issue #$N by @$AUTHOR — trusted."
            elif in_list "$LOWER" "$ALLOW_LABELLED"; then
              LABELS=$(gh api "repos/$REPO/issues/$N" --jq '.labels[].name' 2>/dev/null || echo "")
              if printf '%s\n' "$LABELS" | grep -qx "spec-approved"; then
                echo "Issue #$N by @$AUTHOR — trusted via the spec-approved label."
              else
                echo "::error::Issue #$N was authored by @$AUTHOR, who is trusted only for issues carrying the \"spec-approved\" label. Have a maintainer review the spec and apply that label, or re-file the issue."
                FAILED=1
              fi
            else
              echo "::error::Issue #$N was authored by @$AUTHOR, who is not on the trusted-author allowlist in scripts/routine-gate/config.ts. A PR implementing an untrusted issue cannot merge. If this issue is legitimate, have an allowlisted maintainer re-file or vouch for it."
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All linked issues come from trusted authors."
